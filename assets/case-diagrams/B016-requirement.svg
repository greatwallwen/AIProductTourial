<text x="862" y="612" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="500" fill="#795324">只创建补资料任务，不猜缺失事实</text>
<text x="862" y="654" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#7e6950">不可逆动作保持不可用</text>
<text x="800" y="805" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="600" fill="#365777">角色分开 · 对象明确 · 材料可追溯 · 状态可恢复</text>
